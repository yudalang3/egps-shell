 tip.1.description=The develop team take great effects to the eGPS GUI, so have a good journey to it!
 tip.2.description=There are lots of useful tips(tooltips, prompt, gestures, hints, achievement congratulations et al.) to teach you take advantage of the functionalities.
 tip.3.description=<html>Use the <b>search button</b> in the toolbar to search for the module of interest.
 tip.4.description=<html>Use the <b>preference button</b> in the menu to set the default fonts.
 tip.5.description=<html>The original thread control in <strong>the toolbar</strong> only keep the <i>stop button</i>. The reason is simple: who would have the need for such a pause?
 tip.6.description=<html><p>A busy panel is employed to show the busy status when the computation task running in the module.</p><p>So the user will recognize the status.
 tip.7.description=<html> Enjoy the Introduction module when you launch the eGPS software, we hope you enjoy the classification according to different criterion.
 tip.8.description=<html>Click the <b>Lastest version button</b> to see the download web site and see the novel features.
 tip.9.description=<html>You can direct contact us for bugs and feature demands by click <i>Help -> Report bugs</i> in the menu bar.
 tip.10.description=<html>Unlock the modules in <strong>Bonus module</strong> by frequently launch the software.
 tip.11.description=The toolbar contains the common module features, which are required by almost all modules. 
 tip.12.description=<html>If you still need to see the step-by-step tutorial when first time launch the software.<br> Click <i>Restore to default button</i> at left bottom corner in <strong>Preference</strong>.
 tip.13.description=<html>The software support to import svg file as the ICONS, so zoom in or zoom out the icon size in the <strong>Preference</strong> will not lose quality.
 tip.14.description=<html><p>With continuing growth of the discipline of the computational		biology / bioinformatics, people who interest in the eGPS 2.0		includes:	<ul>		<li>(1) Software Framework Developers and Maintainers</li>		<li>(2) Module Developers (including built-in and plugin modules		</li>		<li>(3) Command Line Users</li>		<li>(4) Graphical Interface Users</li>		<li>(5) Script-based Bioinformatics Analysts (direct support for			Java and R users here; Python users can utilize command line			functionalities).</li>	</ul>
 tip.15.description=<html>If any error happened, see the Console dialog in <i>Help -> Error Console</i>.
 tip.16.description=<html>You can use the accelerator key <i>Ctrl + 1/2/... -> to quick open the mainframe core modules</i>.
 tip.17.description=<html>Cousine font is the equal with font <i>Have a try!</i>.

