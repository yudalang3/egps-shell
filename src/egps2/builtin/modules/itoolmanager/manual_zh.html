<blockquote>
	<h3>解决的问题：</h3>
	<p>提供模块管理器，实现用户可以自主配置加载模块的功能</p>

	<h3>主要功能：</h3>
	<p>1. 管理软件具体加载的模块。</p>

	<h3>快速开始：</h3>
	<p>所有操作都比较直观、易懂。请按照图形用户界面的指示进行操作。</p>
	<p>备注：</p>
	<p>1：用户修改完之后，记得点击工具栏的保存按钮。</p>
	<p>2：用户鼠标悬停在Tooltip ?上时可以查看模块的说明。</p>
	<p>3：点击表格头部可以排序。</p>
	<p>4：底部可以全选/反选以及搜索。</p>
	<h3>更多的教程和帮助：</h3>
	<p>可以查看该网址获得更多的模块信息：<br>https://www.yuque.com/u21499046/egpsdoc/qxcgvio7f2gs4gaz</p>
