	<blockquote>
		<h3>解决的问题：</h3>
		<p>这是一个导航模块，用以快速预览图形界面模块的特性。为数据分析找到合适的分析模块。</p>

		<h3>主要功能：</h3>
		<p>为软件模块提供快速预览功能的机制，用户可以按照不同的分类标准浏览模块。</p>

		<h3>快速开始：</h3>
		<p>所有操作都比较直观、易懂。请按照图形用户界面的指示进行操作。</p>
		<p>备注：</p>
		<p>1：双击左侧按钮可以快速启动模块。</p>
		<p>2：设置面板可以设置是否展示中文说明文档：Preference -> Graphics -> Language </p>
		<h3>更多的教程和帮助：</h3>
		<p>可以查看该网址获得更多的模块信息：<br>https://www.yuque.com/u21499046/egpsdoc/dzfsxdwy90d69m7x</p>
